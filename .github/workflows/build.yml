name: Build Rusdi webOS IPK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          set -x
          sudo apt-get update
          
          # Cross-compiler & base
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            pkg-config cmake \
            nodejs npm \
            qemu-user-static 2>&1 | tee install.log
          
          # SDL2, EGL, GLES, Wayland (armhf)
          sudo apt-get install -y \
            libsdl2-dev:armhf libsdl2-image-dev:armhf libsdl2-ttf-dev:armhf \
            libegl1-mesa-dev:armhf libgles2-mesa-dev:armhf \
            libwayland-dev:armhf 2>&1 | tee -a install.log || echo "Some armhf packages unavailable, continuing..."
          
          # Python 3.11 para pyo3 (armhf)
          sudo apt-get install -y python3.11-dev:armhf 2>&1 | tee -a install.log || echo "python3.11-dev:armhf not available, trying python3-dev:armhf"
          sudo apt-get install -y python3-dev:armhf 2>&1 | tee -a install.log || true
          
          # FFmpeg para ffmpeg_next (armhf)
          sudo apt-get install -y libavcodec-dev:armhf libavformat-dev:armhf libavutil-dev:armhf \
            libswscale-dev:armhf libswresample-dev:armhf 2>&1 | tee -a install.log || echo "FFmpeg armhf packages unavailable, continuing..."
          
          # Verificações
          arm-linux-gnueabihf-gcc --version
          echo "=== PKG_CONFIG_PATH ===" 
          pkg-config --variable=pc_path pkg-config || true
          echo "=== SDL2 armhf ==="
          pkg-config --libs --cflags sdl2 2>/dev/null || echo "SDL2 pkg-config not found for armhf"
      
      - name: Install Rust (armv7 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install ares-cli
        run: |
          npm install -g @webosose/ares-cli
          which ares-package || find /usr -name "ares-package" 2>/dev/null || npm list -g @webosose/ares-cli
      
      - name: Build IPK
        run: |
          set -x
          chmod +x packaging/build.sh
          
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig:/usr/lib/pkgconfig:${PKG_CONFIG_PATH}
          
          cargo build --release --target=armv7-unknown-linux-gnueabihf --verbose 2>&1 | tee cargo_build.log
          
          ./packaging/build.sh armv7-unknown-linux-gnueabihf 2>&1 | tee package_build.log
      
      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusdi-webos-ipk
          path: rusdi-webos_21.0.0_armv7_unknown_linux_gnueabihf.ipk
          retention-days: 30
      
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            cargo_build.log
            package_build.log
            install.log
          retention-days: 7
