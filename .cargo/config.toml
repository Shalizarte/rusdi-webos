[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"
runner = "qemu-arm-static"
rustflags = [
    "-C", "target-feature=+neon,+vfp3",
    "-C", "link-arg=-Wl,--as-needed",
    "-C", "link-arg=-Wl,-z,relro,-z,now",
    "-C", "link-arg=-lgcc_s",
]

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
runner = "qemu-aarch64-static"
rustflags = [
    "-C", "target-feature=+neon",
    "-C", "link-arg=-Wl,--as-needed",
    "-C", "link-arg=-Wl,-z,relro,-z,now",
]

[build]
target = "armv7-unknown-linux-gnueabihf"

[env]
PKG_CONFIG_ALLOW_CROSS = "1"
PKG_CONFIG_SYSROOT_DIR = "/opt/webos-sdk/sysroots/armv7ahf-neon-webos-linux-gnueabi"
PKG_CONFIG_LIBDIR = "/opt/webos-sdk/sysroots/armv7ahf-neon-webos-linux-gnueabi/usr/lib/pkgconfig:/opt/webos-sdk/sysroots/armv7ahf-neon-webos-linux-gnueabi/usr/share/pkgconfig"
